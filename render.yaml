# Render Blueprint - 一键部署到 Render
# 文档:https://render.com/docs/blueprint-spec
#
# 使用方式:
#   1. 把仓库推 GitHub
#   2. Render Dashboard → New → Blueprint → 选仓库
#   3. Render 会自动读本文件,创建 2 个 web service
#   4. 在 ai-portfolio-backend 服务里填 ZHIPUAI_API_KEY
#   5. 等 build 完成(~3-5 分钟,首启要调智谱 embedding API)

services:
  # ---- 后端:Python runtime(build 阶段跑 4 个 seed 脚本)----
  - type: web
    name: ai-portfolio-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      python scripts/seed_manuals.py
      python scripts/seed_production_db.py
      python scripts/train_forecast_model.py
      # 注意:不跑 build_vector_db.py。语义向量已固化到 Git(vectors.npy + docs.json),
      # 避免每次部署重复调智谱 embedding API(18 chunk × 1024 维 ≈ 几千 token/部署)
      # 如需重建(手册内容更新后),本地跑一次并 commit vectors.npy
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ZHIPUAI_API_KEY
        sync: false  # 必须去 Dashboard 手动填
      - key: ZHIPU_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: ZHIPU_MODEL
        value: glm-4-flash
      - key: ALLOWED_ORIGINS
        value: "https://productaidemo-1.onrender.com"  # 前端域名,逗号分隔支持多个
      - key: PYTHONUNBUFFERED
        value: "1"
      # HTTP Basic Auth - 部署后必须用 Dashboard 覆盖默认值(默认值会进 git)
      - key: DEMO_USERNAME
        value: "demo"
      - key: DEMO_PASSWORD
        sync: false  # ⚠️ 必须去 Dashboard 填一个 20+ 位强密码,不要用 config.py 默认值
    healthCheckPath: /health
    autoDeploy: true

  # ---- 前端:Docker 多阶段构建 ----
  - type: web
    name: ai-portfolio-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # NEXT_PUBLIC_API_BASE 必须 build-time inline 到 bundle(Next.js 机制),
    # 不能用 fromService(那是 runtime 注入,build 时拿不到)
    # 后端域名硬编码到 frontend/next.config.js 的 env 字段
    healthCheckPath: /
    autoDeploy: true
